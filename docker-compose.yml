version: '3.8'

services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  auth:
    build: ./services/auth
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      - redis
    networks:
      - school-net

  # Distributed Storage Service - Replicated data across nodes
  distributed-storage:
    build: ./services/distributed-storage
    environment:
      - PORT=7000
      - NODE_ID=primary
      - REPLICATION_NODES=http://storage-replica-1:7001,http://storage-replica-2:7002
    ports:
      - "7000:7000"
    volumes:
      - storage-data:/usr/src/app/data
    networks:
      - school-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: ./services/api
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_URL=http://auth:4000
      - STORAGE_URL=http://distributed-storage:7000
    ports:
      - "3000:3000"
    depends_on:
      - auth
    networks:
      - school-net

  ws:
    build: ./services/ws
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - auth
    networks:
      - school-net

  sms-gateway:
    build: ./services/sms-gateway
    environment:
      - PORT=6000
      - API_URL=http://api:3000
      - AUTH_URL=http://auth:4000
      - TWILIO_SID=${TWILIO_SID}
      - TWILIO_TOKEN=${TWILIO_TOKEN}
      - TWILIO_PHONE=${TWILIO_PHONE}
    ports:
      - "6000:6000"
    depends_on:
      - auth
      - api
    networks:
      - school-net

  communication-service:
    build: ./services/communication-service
    environment:
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_URL=http://auth:4000
      - SMS_GATEWAY_URL=http://sms-gateway:6000
      - WS_SERVICE_URL=http://ws:5000
    ports:
      - "8000:8000"
    depends_on:
      - auth
      - sms-gateway
      - ws
    networks:
      - school-net

  web-app:
    build: ./web-app
    ports:
      - "8080:80"
    depends_on:
      - auth
      - api
      - ws
    networks:
      - school-net

networks:
  school-net:
    driver: bridge

volumes:
  storage-data:
    driver: local
