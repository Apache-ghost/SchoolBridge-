<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SchoolBridge - Demo Client (First Draft)</title>
  <style>
    body { font-family: Inter,Segoe UI,Arial,sans-serif; background: #0f172a; color: #e6eef8; padding: 24px; }
    .card{ background:#0b1220; border:1px solid #112035; padding:12px; border-radius:8px; margin-bottom:12px }
    input,button,select{ padding:8px; margin:4px 0; border-radius:6px; border:1px solid #213244; background:#071024; color:#e6eef8 }
    button{ cursor:pointer }
    #messages{ height:200px; overflow:auto; background:#071026; padding:8px; border-radius:6px }
    .msg { padding:6px; border-bottom:1px solid #0f2233 }
    .me { color:#9be15d }
  </style>
</head>
<body>
  <h1>SchoolBridge — Quick Demo Client (First Draft)</h1>
  <p class="card">This static demo lets you register/login against the local `auth` service and connect to the Socket.IO WS service with the received JWT to send/receive messages.</p>

  <div class="card">
    <h3>Auth</h3>
    <label>Username<br/><input id="username" value="teacher1" /></label><br/>
    <label>Password<br/><input id="password" type="password" value="pass123" /></label><br/>
    <button id="btnRegister">Register</button>
    <button id="btnLogin">Login</button>
    <div id="authResult"></div>
  </div>

  <div class="card">
    <h3>Connection</h3>
    <label>API Base URL<br/><input id="apiBase" value="http://localhost:3000" /></label><br/>
    <label>Auth Base URL<br/><input id="authBase" value="http://localhost:4000" /></label><br/>
    <label>WS URL<br/><input id="wsUrl" value="http://localhost:5000" /></label><br/>
    <button id="btnConnect">Connect WebSocket</button>
    <div id="connState">Not connected</div>
  </div>

  <div class="card">
    <h3>Room Chat</h3>
    <label>Room<br/><input id="room" value="lobby" /></label>
    <button id="btnJoin">Join Room</button>
    <div id="messages"></div>
    <div style="margin-top:8px">
      <input id="msgInput" placeholder="Type a message" style="width:70%;" />
      <button id="btnSend">Send to Room</button>
    </div>
  </div>

  <div class="card">
    <h3>P2P Direct Messages</h3>
    <label>Online Users<br/><select id="onlineUsers"><option>Select user...</option></select></label>
    <button id="btnRefreshUsers">Refresh</button>
    <div id="p2pMessages" style="height:150px; overflow:auto; background:#071026; padding:8px; border-radius:6px; margin:8px 0;"></div>
    <div style="margin-top:8px">
      <input id="p2pInput" placeholder="Type direct message" style="width:60%;" />
      <button id="btnSendP2P">Send P2P</button>
    </div>
  </div>

  <div class="card">
    <h3>Token (debug)</h3>
    <textarea id="token" style="width:100%;height:80px"></textarea>
  </div>

  <script src="https://cdn.socket.io/4.8.0/socket.io.min.js"></script>
  <script>
    const btnRegister = document.getElementById('btnRegister');
    const btnLogin = document.getElementById('btnLogin');
    const authResult = document.getElementById('authResult');
    const tokenArea = document.getElementById('token');
    const btnConnect = document.getElementById('btnConnect');
    const connState = document.getElementById('connState');
    const btnJoin = document.getElementById('btnJoin');
    const btnSend = document.getElementById('btnSend');
    const messages = document.getElementById('messages');
    const btnRefreshUsers = document.getElementById('btnRefreshUsers');
    const btnSendP2P = document.getElementById('btnSendP2P');
    const onlineUsers = document.getElementById('onlineUsers');
    const p2pMessages = document.getElementById('p2pMessages');

    let socket = null;
    let currentToken = '';
    let messageIdCounter = 1;

    function appendMsg(text, klass, container = messages){
      const d = document.createElement('div'); d.className = 'msg '+(klass||''); d.textContent = text; container.appendChild(d); container.scrollTop = container.scrollHeight;
    }

    async function post(url, body){
      const r = await fetch(url, { method: 'POST', body: JSON.stringify(body), headers: {'Content-Type':'application/json'} });
      return r;
    }

    btnRegister.addEventListener('click', async ()=>{
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const authBase = document.getElementById('authBase').value;
      const r = await post(authBase + '/register', { username, password });
      const data = await r.json();
      authResult.textContent = JSON.stringify(data);
    });

    btnLogin.addEventListener('click', async ()=>{
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const authBase = document.getElementById('authBase').value;
      const r = await post(authBase + '/login', { username, password });
      const data = await r.json();
      if (r.ok && data.token){
        currentToken = data.token;
        tokenArea.value = data.token;
        authResult.textContent = 'Login OK';
      } else {
        authResult.textContent = JSON.stringify(data);
      }
    });

    btnConnect.addEventListener('click', ()=>{
      const wsUrl = document.getElementById('wsUrl').value;
      if (!currentToken){ alert('Please login first to get a token'); return; }
      connState.textContent = 'Connecting...';
      socket = io(wsUrl, { auth: { token: currentToken } });
      socket.on('connect', ()=>{ 
        connState.textContent = 'Connected ('+socket.id+')'; 
        appendMsg('Connected to WS as ' + (document.getElementById('username').value),'me'); 
        socket.emit('get_online_users');
      });
      socket.on('connect_error', (err)=>{ connState.textContent = 'Connect error: '+(err && err.message); appendMsg('Connect error: '+(err&&err.message)); });
      
      // Room messages
      socket.on('message', (m)=>{ 
        if(m.type === 'room') appendMsg((m.time||'') + ' | ' + (m.from||'') + ': ' + (m.text||'')); 
      });
      socket.on('joined', (room)=>{ appendMsg('Joined ' + room); });
      
      // P2P messages
      socket.on('p2p_message', (m)=>{ 
        appendMsg('P2P from ' + (m.from||'') + ': ' + (m.text||''), '', p2pMessages); 
      });
      socket.on('p2p_delivered', (data)=>{ 
        appendMsg('✓ Message delivered to ' + data.to, 'me', p2pMessages); 
      });
      socket.on('p2p_error', (data)=>{ 
        appendMsg('✗ P2P Error: ' + data.error, '', p2pMessages); 
      });
      
      // Online users management
      socket.on('online_users', (users)=>{ 
        onlineUsers.innerHTML = '<option>Select user...</option>';
        users.forEach(u => {
          if(u.username !== document.getElementById('username').value) {
            const opt = document.createElement('option');
            opt.value = u.userId;
            opt.textContent = u.username;
            onlineUsers.appendChild(opt);
          }
        });
      });
      socket.on('user_online', (user)=>{ 
        appendMsg('• ' + user.username + ' came online', '', p2pMessages); 
      });
      socket.on('user_offline', (user)=>{ 
        appendMsg('• ' + user.username + ' went offline', '', p2pMessages); 
      });
    });

    btnJoin.addEventListener('click', ()=>{
      const room = document.getElementById('room').value;
      if (!socket) return alert('Connect first');
      socket.emit('join', room);
    });

    btnSend.addEventListener('click', ()=>{
      const room = document.getElementById('room').value;
      const text = document.getElementById('msgInput').value;
      if (!socket) return alert('Connect first');
      socket.emit('message', { room, text });
      appendMsg('Me: ' + text, 'me');
      document.getElementById('msgInput').value = '';
    });

    btnRefreshUsers.addEventListener('click', ()=>{
      if (!socket) return alert('Connect first');
      socket.emit('get_online_users');
    });

    btnSendP2P.addEventListener('click', ()=>{
      const targetUserId = onlineUsers.value;
      const text = document.getElementById('p2pInput').value;
      if (!socket) return alert('Connect first');
      if (!targetUserId || targetUserId === 'Select user...') return alert('Select a user first');
      if (!text.trim()) return;
      
      const messageId = 'msg_' + (messageIdCounter++);
      socket.emit('p2p_message', { targetUserId, text, messageId });
      appendMsg('Me → ' + onlineUsers.options[onlineUsers.selectedIndex].text + ': ' + text, 'me', p2pMessages);
      document.getElementById('p2pInput').value = '';
    });
  </script>
</body>
</html>
