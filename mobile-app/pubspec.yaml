name: schoolbridge_mobile
description: SchoolBridge mobile application - Cross-platform communication platform for schools

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI and utilities
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  
  # State management
  provider: ^6.0.5
  
  # HTTP and networking
  http: ^1.1.0
  socket_io_client: ^2.0.3+1
  
  # Storage
  shared_preferences: ^2.2.0
  
  # JSON handling
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/